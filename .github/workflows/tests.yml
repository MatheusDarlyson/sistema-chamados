name: Tests

# This workflow will run the tests on every push and pull request to the main or master branch.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# The workflow contains a single job called "tests" that runs on the latest version of Ubuntu. It consists of several steps, including checking out the code, setting up PHP and Node.js, installing dependencies, preparing the application, building the frontend, and running the tests.
jobs: 
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test